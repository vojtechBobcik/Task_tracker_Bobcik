<app-header />

<main class="main">
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user [user]="user" (select)="onSelectUser($event)" />
      </li>
    }
  </ul>

  <app-tasks
    [selectedUserId]="selectedUserId"
    [selectedUserName]="selectedUserName"
  >
  </app-tasks>
</main>

<router-outlet />
