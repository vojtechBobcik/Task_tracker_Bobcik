<app-header />

<main class="main">
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user [user]="user" (select)="onSelectUser($event)" />
      </li>
    }
  </ul>
  @if (selectedUserId) {
    <app-tasks [selectedUserName]="selectedUserName"> </app-tasks>
  } @else {
    <p id="fallback">Please select a user.</p>
  }
</main>

<router-outlet />
