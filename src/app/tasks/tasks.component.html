<section id="tasks">
  <header>
    <h2>{{ selectedUserName }}'s Tasks</h2>
    <menu>
      <button>Add Task</button>
    </menu>
  </header>
  <app-create-task></app-create-task>
  <ul>
    @for (task of selectedUserTasks; track task.id) {
      <li><app-task [task]="task" (complete)="onCompleteTask($event)" /></li>
    }
  </ul>
</section>
